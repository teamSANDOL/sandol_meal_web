{% extends "base.html" %}

{% block title %}오류 - 산돌이 학식 콘솔{% endblock %}

{% block content %}
<div class="sd-main sd-main--sm" style="text-align:center; padding-top:72px;">
    <img src="{{ request.url_for('static', path='img/sandol-logo.png') }}" alt="산돌이" style="width:96px; height:96px; border-radius:24px; opacity:.92;">
    <h1 class="sd-title" style="margin-top:20px;">{{ error_title or '문제가 생겼어요' }}</h1>
    <p class="sd-sub" style="font-size:16px; line-height:1.7;">{{ error_message or '요청을 처리하지 못했어요. 잠시 후 다시 시도해주세요.' }}</p>
    {% if error_detail %}
    <div class="sd-alert sd-alert--error" style="display:inline-block; margin-top:18px;">{{ error_detail }}</div>
    {% endif %}
    <div class="sd-actions" style="justify-content:center; margin-top:28px;">
        <a class="sd-btn sd-btn--primary" href="{{ request.url_for('root') }}">홈으로 가기</a>
        {% if session %}
        <a class="sd-btn sd-btn--ghost" href="{{ request.url_for('admin_dashboard_page') if is_admin else request.url_for('owner_restaurants_page') }}">콘솔로 돌아가기</a>
        {% endif %}
    </div>
</div>
{% endblock %}
